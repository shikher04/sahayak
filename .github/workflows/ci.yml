name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── API tests ──────────────────────────────────────────
  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sahayak
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sahayak_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx anyio

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://sahayak:password@localhost:5432/sahayak_test
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://sahayak:password@localhost:5432/sahayak_test
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          NEXTAUTH_SECRET: test-secret
        run: |
          cd apps/api
          pytest -v --cov=. --cov-report=xml

  # ── Frontend type-check + lint ─────────────────────────
  web-check:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: cd apps/web && npx tsc --noEmit

      - name: Lint
        run: cd apps/web && npx next lint

  # ── Build check ───────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [api-test, web-check]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXTAUTH_SECRET: build-time-secret
          NEXTAUTH_URL: http://localhost:3000
        run: cd apps/web && npm run build
